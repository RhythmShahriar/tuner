# Weekly, grouped updates: one pull request for actions (workflows and the
# root action.yml), one for Go modules, one for the container image's base
# and one for the testbed's images. Actions are pinned by commit SHA and
# images by digest; Dependabot updates the pin and its tag together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  # The Dockerfile's distroless base, pinned by tag and digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      image:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  # The testbed's images are pinned by tag and digest; Dependabot moves both.
  - package-ecosystem: docker-compose
    directory: /testbed
    schedule:
      interval: weekly
    groups:
      testbed:
        patterns: ["*"]
    commit-message:
      prefix: test
      include: scope
