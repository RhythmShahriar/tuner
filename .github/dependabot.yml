# Weekly, grouped updates: one pull request for actions (workflows and the
# root action.yml), one for Go modules, one for the testbed's images. Actions are pinned by commit SHA;
# Dependabot updates the SHA and the version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  # The testbed's images are pinned by tag and digest; Dependabot moves both.
  - package-ecosystem: docker-compose
    directory: /testbed
    schedule:
      interval: weekly
    groups:
      testbed:
        patterns: ["*"]
    commit-message:
      prefix: test
      include: scope
