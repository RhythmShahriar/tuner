# Tests action.yml on every runner OS. The fixtures job serves a build of
# this commit from a local mirror and scans local fixtures only; the release
# job installs real releases and checks their signatures.
name: action-test
on:
  push:
    branches: [master]
    paths:
      - action.yml
      - testbed/action/**
      - .github/workflows/action-test.yml
  pull_request:
    paths:
      - action.yml
      - testbed/action/**
      - .github/workflows/action-test.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  MIRROR: http://127.0.0.1:20240
  SITE: http://127.0.0.1:20241
  # The same site, logging each request's headers (testbed/action/header_log.py).
  HEADER_SITE: http://127.0.0.1:20242
  # No vulnerability APIs or check pack downloads: only the fixtures.
  HERMETIC: --no-vulns --no-check-updates --profile quick

jobs:
  fixtures:
    name: fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # A mirror laid out like a release: good/ holds this commit's build
      # and checksums.txt, tampered/ the same checksums with a changed archive.
      - name: Build the mirror
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in Linux) os=linux ;; macOS) os=darwin ;; Windows) os=windows ;; esac
          case "$RUNNER_ARCH" in X64) arch=amd64 ;; ARM64) arch=arm64 ;; esac
          mkdir -p "$RUNNER_TEMP/mirror/good" "$RUNNER_TEMP/mirror/tampered"
          # go build runs in the module; the archive is made here.
          cd "$RUNNER_TEMP/mirror/good"
          if [ "$os" = windows ]; then
            (cd "$GITHUB_WORKSPACE" && go build -o "$RUNNER_TEMP/mirror/good/rhythm-tuner.exe" -ldflags "-X main.version=0.0.0-action-test" ./cmd/rhythm-tuner)
            archive="rhythm-tuner_${os}_${arch}.zip"
            pwsh -NoProfile -Command "Compress-Archive -Path rhythm-tuner.exe -DestinationPath $archive"
            rm rhythm-tuner.exe
          else
            (cd "$GITHUB_WORKSPACE" && go build -o "$RUNNER_TEMP/mirror/good/rhythm-tuner" -ldflags "-X main.version=0.0.0-action-test" ./cmd/rhythm-tuner)
            archive="rhythm-tuner_${os}_${arch}.tar.gz"
            tar -czf "$archive" rhythm-tuner
            rm rhythm-tuner
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$archive"; else shasum -a 256 "$archive"; fi > checksums.txt
          cp "$archive" checksums.txt ../tampered/
          printf 'tampered' >> "../tampered/$archive"

      - name: Start the mirror and the fixture site
        shell: bash
        run: |
          set -euo pipefail
          py=$(command -v python3 || command -v python)
          nohup "$py" -m http.server 20240 --bind 127.0.0.1 --directory "$RUNNER_TEMP/mirror" > "$RUNNER_TEMP/mirror.log" 2>&1 &
          nohup "$py" -m http.server 20241 --bind 127.0.0.1 --directory testbed/action/site > "$RUNNER_TEMP/site.log" 2>&1 &
          nohup "$py" testbed/action/header_log.py 20242 testbed/action/site "$RUNNER_TEMP/headers.log" > "$RUNNER_TEMP/header-site.log" 2>&1 &
          for _ in $(seq 50); do
            if curl -fsS -o /dev/null "$MIRROR/good/checksums.txt" && curl -fsS -o /dev/null "$SITE/" &&
              curl -fsS -o /dev/null "$HEADER_SITE/"; then exit 0; fi
            sleep 0.2
          done
          echo "::error::fixture servers didn't start"
          cat "$RUNNER_TEMP/mirror.log" "$RUNNER_TEMP/site.log" "$RUNNER_TEMP/header-site.log"
          exit 1

      - name: Scan the fixture site
        id: url
        uses: ./
        with:
          target: ${{ env.SITE }}
          fail-on: none
          sarif: true
          sarif-upload: false
          args: ${{ env.HERMETIC }}
          verify-signature: false
          download-url: ${{ env.MIRROR }}/good

      - name: Check the outputs
        shell: bash
        env:
          SCORE: ${{ steps.url.outputs.score }}
          FINDINGS: ${{ steps.url.outputs.findings }}
          CODE: ${{ steps.url.outputs.exit-code }}
          REPORT: ${{ steps.url.outputs.report }}
          SARIF: ${{ steps.url.outputs.sarif-file }}
        run: |
          set -euo pipefail
          echo "score=$SCORE findings=$FINDINGS exit-code=$CODE"
          [ "$CODE" = 0 ] || { echo "::error::fail-on none should exit 0, got $CODE"; exit 1; }
          [ "$FINDINGS" -gt 0 ] || { echo "::error::expected findings from the leaky fixture"; exit 1; }
          [ "$SCORE" -lt 100 ] || { echo "::error::expected a score below 100, got $SCORE"; exit 1; }
          jq -e '.findings | any(.id == "leak-dotenv")' "$REPORT" > /dev/null || { echo "::error::leak-dotenv missing from the report"; exit 1; }
          jq -e '.runs[0].results | length > 0' "$SARIF" > /dev/null || { echo "::error::$SARIF has no results"; exit 1; }
          if grep -q fixture-not-a-real-password "$REPORT" "$SARIF"; then
            echo "::error::the fixture secret appears unmasked"
            exit 1
          fi

      # A header value with spaces (every "Name: value" has one) must reach
      # the site whole, the way init ci tells users to pass credentials.
      - name: Scan with headers and a cookie
        uses: ./
        with:
          target: ${{ env.HEADER_SITE }}
          fail-on: none
          headers: |
            Authorization: Bearer fixture token with spaces
            X-Tuner-Test: a * b ? c
          cookie: session=fixture cookie
          args: ${{ env.HERMETIC }}
          verify-signature: false
          download-url: ${{ env.MIRROR }}/good

      - name: Check the headers arrived whole
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/headers.log"
          [ -s "$log" ] || { echo "::error::the header site saw no requests"; exit 1; }
          for want in 'Authorization: Bearer fixture token with spaces' 'X-Tuner-Test: a * b ? c' 'Cookie: session=fixture cookie'; do
            grep -qxF "$want" "$log" || { echo "::error::no request carried \"$want\""; sort -u "$log"; exit 1; }
          done
          echo "every request header arrived whole"

      - name: Gate on the exposed .env
        id: gate
        continue-on-error: true
        uses: ./
        with:
          target: ${{ env.SITE }}
          fail-on: high
          args: ${{ env.HERMETIC }}
          verify-signature: false
          download-url: ${{ env.MIRROR }}/good

      - name: Check the gate failed the step
        shell: bash
        env:
          OUTCOME: ${{ steps.gate.outcome }}
          CODE: ${{ steps.gate.outputs.exit-code }}
        run: |
          [ "$OUTCOME" = failure ] && [ "$CODE" = 1 ] ||
            { echo "::error::fail-on high should fail the step with exit 1; got $OUTCOME, $CODE"; exit 1; }

      # The exposed .env is a confirmed finding, so it still fails the step
      # when only confirmed findings count.
      - name: Gate on confirmed findings only
        id: confirmed
        continue-on-error: true
        uses: ./
        with:
          target: ${{ env.SITE }}
          fail-on: high
          min-confidence: confirmed
          args: ${{ env.HERMETIC }}
          verify-signature: false
          download-url: ${{ env.MIRROR }}/good

      # high is the older name for confirmed and must not be a usage error.
      - name: Gate with the older confidence name
        id: confidence-alias
        continue-on-error: true
        uses: ./
        with:
          target: ${{ env.SITE }}
          fail-on: high
          min-confidence: high
          args: ${{ env.HERMETIC }}
          verify-signature: false
          download-url: ${{ env.MIRROR }}/good

      - name: Check the confidence gates
        shell: bash
        env:
          OUTCOME: ${{ steps.confirmed.outcome }}
          CODE: ${{ steps.confirmed.outputs.exit-code }}
          ALIAS_OUTCOME: ${{ steps.confidence-alias.outcome }}
          ALIAS_CODE: ${{ steps.confidence-alias.outputs.exit-code }}
        run: |
          [ "$OUTCOME" = failure ] && [ "$CODE" = 1 ] ||
            { echo "::error::min-confidence confirmed should fail on the .env with exit 1; got $OUTCOME, $CODE"; exit 1; }
          [ "$ALIAS_OUTCOME" = failure ] && [ "$ALIAS_CODE" = 1 ] ||
            { echo "::error::min-confidence high should work like confirmed; got $ALIAS_OUTCOME, $ALIAS_CODE"; exit 1; }

      - name: Scan the fixture folder
        id: folder
        uses: ./
        with:
          target: ./testbed/action/wordpress
          fail-on: high
          args: ${{ env.HERMETIC }}
          verify-signature: false
          download-url: ${{ env.MIRROR }}/good

      - name: Check the folder outputs
        shell: bash
        env:
          SCORE: ${{ steps.folder.outputs.score }}
          FINDINGS: ${{ steps.folder.outputs.findings }}
          REPORT: ${{ steps.folder.outputs.report }}
        run: |
          set -euo pipefail
          echo "score=$SCORE findings=$FINDINGS"
          [ "$FINDINGS" -gt 0 ] && [ "$SCORE" -lt 100 ] || { echo "::error::expected findings in the fixture folder"; exit 1; }
          jq -e '.findings | any(.id == "local-wp-salts")' "$REPORT" > /dev/null || { echo "::error::local-wp-salts missing"; exit 1; }

      # Last, since a failed install removes the binary the steps above used.
      - name: Install a tampered build
        id: tampered
        continue-on-error: true
        uses: ./
        with:
          target: ${{ env.SITE }}
          verify-signature: false
          download-url: ${{ env.MIRROR }}/tampered

      - name: Check the tampered build was refused
        shell: bash
        env:
          OUTCOME: ${{ steps.tampered.outcome }}
          CODE: ${{ steps.tampered.outputs.exit-code }}
        run: |
          [ "$OUTCOME" = failure ] && [ -z "$CODE" ] ||
            { echo "::error::a checksum mismatch must stop the install before any scan; got $OUTCOME, exit code '$CODE'"; exit 1; }

  # Real releases from GitHub, with the keyless signature checked by cosign.
  release:
    name: release (${{ matrix.os }}, ${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: [latest, 0.3.2]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the fixture folder
        id: scan
        uses: ./
        with:
          target: ./testbed/action/wordpress
          version: ${{ matrix.version }}
          fail-on: none
          args: ${{ env.HERMETIC }}
      - name: Check the outputs
        shell: bash
        env:
          SCORE: ${{ steps.scan.outputs.score }}
          FINDINGS: ${{ steps.scan.outputs.findings }}
        run: |
          echo "score=$SCORE findings=$FINDINGS"
          [ -n "$SCORE" ] && [ "$FINDINGS" -gt 0 ] || { echo "::error::no score or findings from the release build"; exit 1; }
