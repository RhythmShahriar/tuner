# Every uses: names a full commit SHA with its version in a comment, so a
# moved tag or a push to another repository can't change how Tuner is
# built. Dependabot proposes the bumps; `make pins` (the pins job) fails on
# anything else.
name: ci
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # The shared workflows have no tags, so Dependabot can't bump these.
  # Move both SHAs by hand after a change in RhythmShahriar/.github.
  go:
    uses: RhythmShahriar/.github/.github/workflows/ci-go.yml@d296f34c9b6629211c68561504d938c404afaf74 # master 2026-10-24
  commitlint:
    uses: RhythmShahriar/.github/.github/workflows/commitlint.yml@d296f34c9b6629211c68561504d938c404afaf74 # master 2026-10-24

  workflows:
    name: pins, actionlint and goreleaser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Every action pinned by SHA
        run: make pins
      # actionlint runs shellcheck, preinstalled on ubuntu-latest, over
      # every run: block.
      - name: actionlint
        run: make actionlint
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: check
