# Every uses: names a full commit SHA with its version in a comment, so a
# moved tag or a push to another repository can't change how Tuner is
# built. Dependabot proposes the bumps; `make pins` (the pins job) fails on
# anything else.
name: ci
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # The shared workflows have no tags, so Dependabot can't bump these.
  # Move both SHAs by hand after a change in RhythmShahriar/.github.
  # Build, vet and race tests on every OS a binary ships for. go.mod pins
  # a released kit, so the job builds against it without a local checkout.
  # ./... includes the scenario suite (testbed/scenarios).
  go:
    uses: RhythmShahriar/.github/.github/workflows/ci-go.yml@4e1c576341190242c956652d00cea38d7918cd40 # master 2026-10-26
    with:
      os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      # The writing rules (scripts/check-style.py in RhythmShahriar/.github)
      # over every tracked text file, Linux job only.
      style: true
  commitlint:
    uses: RhythmShahriar/.github/.github/workflows/commitlint.yml@4e1c576341190242c956652d00cea38d7918cd40 # master 2026-10-26

  workflows:
    name: pins, actionlint and goreleaser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Every action pinned by SHA
        run: make pins
      # actionlint runs shellcheck, preinstalled on ubuntu-latest, over
      # every run: block.
      - name: actionlint
        run: make actionlint
      - name: actionlint on what init ci generates
        run: make init-ci-lint
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: check

  # The scenario suite again on its own, for its table of passes and
  # expected failures in the job summary.
  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: scenario suite
        run: TUNER_SCENARIO_SUMMARY="$GITHUB_STEP_SUMMARY" make testbed-fast

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: make vuln

  checks-lint:
    name: checks lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: rhythm-tuner checks lint
        run: make checks-lint
