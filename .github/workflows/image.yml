# Builds the container image with GoReleaser in snapshot mode (no push)
# and smoke-tests it, so a change to the Dockerfile or the goreleaser
# docker config is caught before a release. The real multi-arch push and
# signing happen on a tag through release.yml. Every uses: is pinned by
# SHA (make pins).
name: image
on:
  push:
    branches: [master]
    paths: [Dockerfile, .goreleaser.yaml, .github/workflows/image.yml]
  pull_request:
    paths: [Dockerfile, .goreleaser.yaml, .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # --snapshot builds the images from .goreleaser.yaml for both
      # architectures without pushing. --skip=sign leaves cosign out: no
      # signing happens off a real tag.
      - name: Build the image (snapshot)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --snapshot --clean --skip=sign,archive,announce,publish
      # /v0/health answers. With no TUNER_SERVE_TOKEN the container
      # refuses to serve on 0.0.0.0. Both need the serve command, which is
      # built in another lane (vulns-service V10); until it lands the
      # image runs `rhythm-tuner serve` and exits with "unknown command",
      # so the checks are skipped with a notice instead of failing.
      - name: Smoke-test the image
        run: |
          set -uo pipefail
          image=$(docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep '^ghcr.io/rhythmshahriar/tuner:' | grep -- '-amd64$' | head -n1)
          [ -n "$image" ] || { echo "::error::no amd64 image was built"; exit 1; }
          echo "built $image"

          if ! docker run --rm --entrypoint /usr/local/bin/rhythm-tuner "$image" serve --help >/dev/null 2>&1; then
            echo "::notice::this build has no serve command yet (vulns-service V10); skipping the health and token checks"
            exit 0
          fi

          # Without a token the service must refuse to start on 0.0.0.0:
          # it exits non-zero on its own, names the variable and leaves no
          # container behind. A serve that logs the name and keeps serving
          # is still running at the timeout and fails here.
          name=tuner-smoke-notoken
          timeout 20 docker run --name "$name" -e TUNER_SERVE_TOKEN= "$image" > notoken.log 2>&1
          code=$?
          cat notoken.log
          running=$(docker inspect -f '{{.State.Running}}' "$name" 2>/dev/null || echo false)
          docker rm -f "$name" >/dev/null 2>&1 || true
          [ "$code" -ne 124 ] && [ "$running" = false ] || { echo "::error::with no token the container kept running"; exit 1; }
          [ "$code" -ne 0 ] || { echo "::error::serving with no token exited 0"; exit 1; }
          grep -qi 'TUNER_SERVE_TOKEN' notoken.log || { echo "::error::the refusal does not name TUNER_SERVE_TOKEN"; exit 1; }

          # With a token it answers /v0/health.
          cid=$(docker run -d -p 127.0.0.1:8080:8080 -e TUNER_SERVE_TOKEN=smoke-token "$image")
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/v0/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 0.5
          done
          [ "${ok:-}" = 1 ] || { echo "::error::/v0/health did not answer"; docker logs "$cid"; exit 1; }
          echo "/v0/health answered"
