version: "2"
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - goheader
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - unconvert
    - revive
  settings:
    revive:
      rules:
        # Every package says what it is for and every exported identifier
        # carries a doc comment. Stuttering names are left alone: renaming
        # them would break the API that tests and packs build on.
        - name: package-comments
        - name: exported
          arguments: [disableStutteringCheck]
    goheader:
      values:
        regexp:
          YEARS: '20\d\d(-20\d\d)?'
          LICENSE: '(AGPL-3\.0-only|MIT)' # checks/ is MIT, the scanner AGPL
      template: |-
        Copyright (c) {{ YEARS }} Rhythm Shahriar <me@rhy.io>
        SPDX-License-Identifier: {{ LICENSE }}
    errcheck:
      exclude-functions: # terminal output; nothing useful to do if stdout is gone
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    misspell:
      locale: US
      ignore-rules: [authorised] # user-facing copy uses British English
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, gosec, revive]
formatters:
  enable: [gofmt]
