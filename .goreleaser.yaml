# Release config. The archive and checksum names are a contract with
# rhythm/kit/update and the install script: <binary>_<os>_<arch>.tar.gz
# (.zip on Windows) plus checksums.txt.
version: 2
project_name: rhythm-tuner

builds:
  - main: ./cmd/rhythm-tuner
    binary: rhythm-tuner
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE*]

checksum:
  name_template: checksums.txt

# One image per architecture on distroless (see Dockerfile), stitched into
# a multi-arch manifest below. Pushed only on a real release; CI builds
# them with --snapshot and never pushes (.github/workflows/image.yml).
dockers:
  - use: buildx
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    image_templates:
      - "ghcr.io/rhythmshahriar/tuner:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.source=https://github.com/RhythmShahriar/tuner"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=AGPL-3.0-only"
  - use: buildx
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    image_templates:
      - "ghcr.io/rhythmshahriar/tuner:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.source=https://github.com/RhythmShahriar/tuner"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=AGPL-3.0-only"

docker_manifests:
  - name_template: "ghcr.io/rhythmshahriar/tuner:{{ .Version }}"
    image_templates:
      - "ghcr.io/rhythmshahriar/tuner:{{ .Version }}-amd64"
      - "ghcr.io/rhythmshahriar/tuner:{{ .Version }}-arm64"
  # A stable release also moves the floating major tag and :latest.
  - name_template: "ghcr.io/rhythmshahriar/tuner:v{{ .Major }}"
    skip_push: auto # goreleaser skips this for a prerelease
    image_templates:
      - "ghcr.io/rhythmshahriar/tuner:{{ .Version }}-amd64"
      - "ghcr.io/rhythmshahriar/tuner:{{ .Version }}-arm64"
  - name_template: "ghcr.io/rhythmshahriar/tuner:latest"
    skip_push: auto
    image_templates:
      - "ghcr.io/rhythmshahriar/tuner:{{ .Version }}-amd64"
      - "ghcr.io/rhythmshahriar/tuner:{{ .Version }}-arm64"

# Keyless Sigstore signature over each image's manifest, like the one over
# checksums.txt. Verify with the same identity:
#   cosign verify ghcr.io/rhythmshahriar/tuner:<version> \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github\.com/RhythmShahriar/\.github/\.github/workflows/release-go\.yml@'
docker_signs:
  - cmd: cosign
    artifacts: manifests
    args: [sign, "--yes", "${artifact}@${digest}"]

# A tag like v0.4.0-rc1 is published as a prerelease, which GitHub never
# reports as "latest", so rhythm update and the installers don't offer it.
release:
  prerelease: auto

# Keyless Sigstore signature over checksums.txt, made by the shared
# release-go.yml (see .github/workflows/release.yml). Any repository can call
# that workflow, so check the repository and tag too. Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity https://github.com/RhythmShahriar/.github/.github/workflows/release-go.yml@refs/heads/master \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-github-workflow-repository RhythmShahriar/tuner \
#     --certificate-github-workflow-ref refs/tags/v<version> checksums.txt
# release-go.yml picks the GoReleaser that builds releases; CI and
# `make release-check` validate this file with an exact one (v2.18.3).
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, "--bundle=${signature}", "${artifact}", --yes]

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude: ['^(docs|test|ci|chore|style)(\(.+\))?!?:']
