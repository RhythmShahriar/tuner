id: hdr-frame-options-missing
name: Clickjacking protection missing
severity: low
profile: quick
tags: [headers]
request:
  path: ["/"]
match:
  all:
    - status: 200
    - missing_header: [X-Frame-Options]
      not_header: {Content-Security-Policy: frame-ancestors}
impact: Pages can be framed by other sites, which allows clickjacking.
fix: |
  nginx:  add_header X-Frame-Options SAMEORIGIN always;
  apache: Header always set X-Frame-Options SAMEORIGIN
