positive:
  - name: header absent
    routes:
      /: {body: home}
negative:
  - name: header set
    routes:
      /: {headers: {X-Frame-Options: "x"}, body: home}
  - name: csp frame-ancestors instead
    routes:
      /: {headers: {Content-Security-Policy: "frame-ancestors 'self'"}, body: home}
