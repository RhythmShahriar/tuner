positive:
  - name: history public
    routes:
      /_debugbar/open: {body: '[{"id":"X0a1b2c3d4e5f","datetime":"2026-10-24 10:00:00","utime":"1761300000.1234","method":"GET","uri":"/checkout","ip":"203.0.113.9"}]'}
