positive:
  - name: dashboard public
    routes:
      /telescope: {body: "<html><head><title>Telescope - Shop</title></head><body><div id=\"telescope\"></div><script>window.Telescope = {\"path\":\"telescope\"};</script></body></html>"}
negative:
  - name: not found
    routes: {}
  - name: gate says no
    routes:
      /telescope: {status: 403}
  - name: catch-all that serves the dashboard for every path
    default: {status: 200, body: "<html><title>Telescope</title></html>"}
