positive:
  - name: branch format readable
    routes:
      /.bzr/branch-format: {body: "Bazaar-NG meta directory, format 1\n"}
negative:
  - name: not found
    routes: {}
  - name: soft-404 catch-all
    default: {status: 200, body: "<html>Not found</html>"}
  - name: catch-all that serves the same file for every path
    default: {status: 200, body: "Bazaar-NG meta directory, format 1\n"}
