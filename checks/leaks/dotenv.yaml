id: leak-dotenv
name: .env file exposed
severity: critical
profile: quick
tags: [leak, secrets, php, laravel, wordpress]
request:
  path: ["/.env", "/.env.local", "/.env.production", "/.env.backup"]
match:
  all:
    - status: 200
    # Names only: the match stops at "=", so no value can reach the
    # evidence, whatever the variable is called.
    - regex: '(?m)^[A-Za-z_][A-Za-z0-9_]*='
    # A docs or error page that shows example KEY=value lines.
    - not_regex: '(?i)<(?:!doctype|html|head|body)[\s>]'
    - not_baseline: true
extract:
  secrets: true
impact: Anyone can read database passwords, API keys and app secrets.
fix: |
  Deny access to dotfiles, then rotate every secret in the file.
  nginx:  location ~ /\.(?!well-known) { deny all; }
  apache: <FilesMatch "^\."> Require all denied </FilesMatch>
fix_server:
  nginx: |
    location ~ /\.(?!well-known) { deny all; }
  apache: |
    <FilesMatch "^\.">
      Require all denied
    </FilesMatch>
references:
  - https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
