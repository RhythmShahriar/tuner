positive:
  - name: error_log in web root
    routes:
      /error_log:
        body: "[23-Oct-2026 10:00:00 UTC] PHP Warning:  Undefined variable $x in /home/site/public_html/index.php on line 3\n"
negative:
  - name: not found
    routes: {}
  - name: soft-404 catch-all
    default: {status: 200, body: "<html>Not found</html>"}
