id: leak-git
name: .git directory exposed
severity: high
profile: quick
tags: [leak, source]
request:
  path: ["/.git/HEAD", "/.git/config"]
match:
  all:
    - status: 200
    - not_baseline: true
  any:
    - regex: '\Aref: refs/'
    - regex: '\A[0-9a-f]{40}\s*\z'
    - regex: '\[core\]'
extract:
  secrets: true
impact: The full source code and history can be downloaded, often including old credentials.
fix: |
  Deny access to .git, or deploy without it.
  nginx:  location ~ /\.git { deny all; }
  apache: RedirectMatch 404 /\.git
references:
  - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/04-Review_Old_Backup_and_Unreferenced_Files_for_Sensitive_Information
