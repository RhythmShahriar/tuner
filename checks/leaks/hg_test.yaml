positive:
  - name: requires readable
    routes:
      /.hg/requires: {body: "dotencode\nfncache\ngeneraldelta\nrevlogv1\nstore\n"}
  - name: hgrc with credentials
    expect_secrets: true
    routes:
      /.hg/hgrc: {body: "[paths]\ndefault = https://deploy:Wint3r-is-c0ming@hg.example.test/shop\n"}
negative:
  - name: not found
    routes: {}
  - name: soft-404 catch-all
    default: {status: 200, body: "<html>Not found</html>"}
  - name: catch-all that serves the same file for every path
    default: {status: 200, body: "store\n"}
