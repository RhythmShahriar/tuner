id: leak-htpasswd
name: .htpasswd file exposed
severity: high
tags: [leak, credentials]
request:
  path: ["/.htpasswd", "/wp-admin/.htpasswd"]
match:
  all:
    - status: 200
    - regex: '(?m)^[^:\s]+:(?:\$apr1\$|\$2[aby]\$|\{SHA\}|\$[56]\$)'
impact: Password hashes for HTTP basic auth can be downloaded and cracked offline.
fix: |
  Store .htpasswd outside the web root and change the passwords.
  apache: <Files ".ht*"> Require all denied </Files>
fix_server:
  nginx: |
    location ~ /\.ht { deny all; }
  apache: |
    <Files ".ht*">
      Require all denied
    </Files>
