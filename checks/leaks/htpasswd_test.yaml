positive:
  - name: apr1 hash readable
    routes:
      /.htpasswd: {body: "admin:$apr1$abc12345$ZmFrZWhhc2hmYWtlaGFzaA\n"}
negative:
  - name: denied
    routes:
      /.htpasswd: {status: 403}
  - name: soft-404 catch-all
    default: {status: 200, body: "<html>Not found</html>"}
  - name: catch-all that serves the same hashes for every path
    default: {status: 200, body: "admin:$apr1$abcdefgh$ijklmnopqrstuvwxyz0123\n"}
