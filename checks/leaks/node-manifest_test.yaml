positive:
  - name: package.json on a PHP site
    routes:
      /: {headers: {X-Powered-By: "PHP/8.2.1"}, body: home}
      /package.json: {body: '{"name": "shop-theme", "devDependencies": {"webpack": "5.90.0"}}'}
  - name: yarn.lock on a PHP site
    routes:
      /: {headers: {X-Powered-By: "PHP/8.2.1"}, body: home}
      /yarn.lock: {body: "# THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.\n# yarn lockfile v1\n"}
negative:
  - name: not a PHP site
    routes:
      /: {body: home}
      /package.json: {body: '{"name": "app", "dependencies": {"react": "19.0.0"}}'}
  - name: not found
    routes:
      /: {headers: {X-Powered-By: "PHP/8.2.1"}, body: home}
  - name: catch-all that serves the same JSON for every path
    routes:
      /: {headers: {X-Powered-By: "PHP/8.2.1"}, body: home}
    default: {status: 200, body: '{"dependencies": {}}'}
