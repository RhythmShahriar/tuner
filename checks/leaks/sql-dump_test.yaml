positive:
  - name: mysqldump in web root
    routes:
      /backup.sql:
        body: |
          -- MySQL dump 10.13  Distrib 8.0.36
          CREATE TABLE `wp_users` (`ID` bigint unsigned NOT NULL);
  # SMTP and backup plugins keep their settings serialized in wp_options.
  - name: dump with post smtp, wp mail smtp and updraftplus s3 options
    expect_secrets: true
    routes:
      /wp.sql:
        body: |
          -- MySQL dump 10.13  Distrib 8.0.36
          INSERT INTO `wp_options` VALUES (101,'postman_options','a:3:{s:9:"auth_type";s:5:"login";s:19:"basic_auth_password";s:16:"PostSmtpPass2026";s:15:"mailgun_api_key";s:36:"key-0123456789abcdef0123456789abcdef";}','yes');
          INSERT INTO `wp_options` VALUES (102,'wp_mail_smtp','a:1:{s:4:"smtp";a:2:{s:4:"user";s:9:"mailer@ex";s:4:"pass";s:18:"WpMailSmtpPass2026";}}','yes');
          INSERT INTO `wp_options` VALUES (103,'updraft_s3','a:3:{s:9:"accesskey";s:20:"AKIAIOSFODNN7EXAMPLE";s:9:"secretkey";s:40:"wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY";s:4:"path";s:12:"site-backups";}','yes');
negative:
  - name: blocked dump
    routes:
      /wp.sql:
        status: 403
        body: "INSERT INTO `wp_options` VALUES (1,'postman_options','a:1:{s:19:\"basic_auth_password\";s:4:\"pass\";}','yes');"
  - name: not found
    routes: {}
  - name: soft-404 catch-all
    default: {status: 200, body: "<html>Not found</html>"}
