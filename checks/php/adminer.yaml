id: php-adminer
name: Adminer database tool exposed
severity: medium
tags: [php, database, admin]
request:
  path: ["/adminer.php", "/adminer/", "/adminer/index.php", "/_adminer.php"]
match:
  all:
    - status: 200
    - regex: '(?i)<title>[^<]*Adminer'
impact: A public database login page invites password guessing against the database.
fix: Remove Adminer when you're done with it, or restrict it to your IP address.
