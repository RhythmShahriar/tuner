positive:
  - name: pi.php left behind
    routes:
      /pi.php: {body: "<html><head><title>PHP 8.2.1 - phpinfo()</title></head></html>"}
negative:
  - name: not found
    routes: {}
  - name: soft-404 catch-all
    default: {status: 200, body: "<html>Not found</html>"}
  - name: catch-all that serves phpinfo for every path
    default: {status: 200, body: "<html><title>phpinfo()</title></html>"}
