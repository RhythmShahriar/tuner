positive:
  - name: profiler public
    routes:
      /_profiler/: {body: "<!DOCTYPE html><html><head><title>Symfony Profiler</title></head><body></body></html>"}
negative:
  - name: not found
    routes: {}
  - name: soft-404 catch-all
    default: {status: 200, body: "<html>Not found</html>"}
  - name: catch-all that serves the profiler for every path
    default: {status: 200, body: "<title>Symfony Profiler</title>"}
