id: srv-nginx-status
name: nginx status page public
severity: low
tags: [server, disclosure]
request:
  path: ["/nginx_status", "/nginx-status"]
match:
  all:
    - status: 200
    - regex: '\AActive connections:\s*\d+'
    - not_baseline: true
impact: Connection counts show the site's load, which helps time or measure a denial-of-service attack.
fix: |
  In the location that has stub_status, add these lines before stub_status:
    allow 127.0.0.1;
    deny all;
references:
  - https://nginx.org/en/docs/http/ngx_http_stub_status_module.html
