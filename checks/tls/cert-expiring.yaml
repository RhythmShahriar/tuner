id: tls-cert-expiring
name: TLS certificate expires soon
severity: medium
profile: quick
tags: [tls, transport]
request:
  path: ["/"]
match:
  all:
    - tls: {expires_within_days: 14}
impact: The site will show a browser security warning when the certificate expires.
fix: Renew the certificate, and check that automatic renewal is running.
