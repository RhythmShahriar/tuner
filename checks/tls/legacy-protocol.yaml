id: tls-legacy-protocol
name: Obsolete TLS 1.0/1.1 accepted
severity: medium
tags: [tls, transport]
request:
  path: ["/"]
match:
  all:
    - tls: {legacy: true}
impact: TLS 1.0 and 1.1 are deprecated (RFC 8996) and have known weaknesses.
fix: |
  Allow only TLS 1.2 and 1.3.
  nginx:  ssl_protocols TLSv1.2 TLSv1.3;
  apache: SSLProtocol -all +TLSv1.2 +TLSv1.3
references:
  - https://datatracker.ietf.org/doc/html/rfc8996
