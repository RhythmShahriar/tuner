id: wp-debug-log
name: WordPress debug.log exposed
severity: high
profile: quick
tags: [wordpress, leak, secrets]
request:
  path: ["/wp-content/debug.log"]
match:
  all:
    - status: 200
    - regex: 'PHP (?:Fatal error|Warning|Notice|Parse error|Deprecated):'
    - not_baseline: true
extract:
  secrets: true
impact: The log reveals server paths, plugin errors and sometimes queries with personal data.
fix: |
  Turn off WP_DEBUG_LOG on production or point it outside the web root:
  define( 'WP_DEBUG_LOG', '/var/log/wordpress/debug.log' );
  Then delete wp-content/debug.log.
fix_server:
  nginx: |
    location ~* (\.log|/error_log)$ { deny all; }
  apache: |
    <FilesMatch "(\.log|^error_log)$">
      Require all denied
    </FilesMatch>
references:
  - https://developer.wordpress.org/advanced-administration/debug/debug-wordpress/
