positive:
  - name: installer answers
    routes:
      /installer.php: {body: "<html><head><title>Duplicator</title></head><body><div id='header'>Duplicator Installer: Step 1 of 4</div></body></html>"}
negative:
  - name: not found
    routes: {}
  - name: soft-404 catch-all
    default: {status: 200, body: "<html>Not found</html>"}
  - name: catch-all that serves the installer for every path
    default: {status: 200, body: "<html><title>Duplicator</title><p>Installer</p></html>"}
