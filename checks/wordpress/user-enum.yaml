id: wp-user-enum-rest
name: User enumeration via REST API
severity: medium
profile: quick
tags: [wordpress, enumeration]
requires: [wordpress]
request:
  path: ["/wp-json/wp/v2/users"]
match:
  all:
    - status: 200
    - regex: '"slug"\s*:\s*"[^"]+"'
impact: Login names are public, which halves the work of a password-guessing attack.
fix: |
  Restrict the users endpoint to logged-in users, e.g. with a security plugin, or:
  add_filter( 'rest_endpoints', function ( $e ) {
      if ( ! is_user_logged_in() ) { unset( $e['/wp/v2/users'], $e['/wp/v2/users/(?P<id>[\d]+)'] ); }
      return $e;
  } );
