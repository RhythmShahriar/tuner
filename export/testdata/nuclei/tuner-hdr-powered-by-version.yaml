id: tuner-hdr-powered-by-version
info:
  name: X-Powered-By leaks version
  author: rhythm-tuner
  severity: low
  description: Reveals the exact PHP version, making known vulnerabilities easy to target.
  remediation: |-
    php.ini: expose_php = Off
    nginx:   fastcgi_hide_header X-Powered-By;
  reference:
    - https://cheatsheetseries.owasp.org/cheatsheets/HTTP_Headers_Cheat_Sheet.html
    - https://www.php.net/manual/en/ini.core.php#ini.expose-php
  tags: tuner,headers,disclosure
  metadata:
    max-request: 1
    tuner-id: hdr-powered-by-version
    tuner-profile: quick
    fix-nginx: fastcgi_hide_header X-Powered-By;
    fix-apache: |-
      Header unset X-Powered-By
      Header always unset X-Powered-By
http:
  - method: GET
    path:
      - '{{BaseURL}}/'
    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - (?mi)^X-Powered-By:[ \t]*(?-i:[^\r\n]*?\d)
