id: tuner-leak-archive-backup
info:
  name: Site backup archive exposed
  author: rhythm-tuner
  severity: critical
  description: A full copy of the site, usually including configuration and secrets, can be downloaded.
  remediation: Move backups out of the web root and store them somewhere private.
  reference:
    - https://cwe.mitre.org/data/definitions/530.html
  tags: tuner,leak,backup
  metadata:
    max-request: 12
    tuner-id: leak-archive-backup
    tuner-profile: default
    fix-nginx: |-
      # Add your own domain, e.g. example\.com, to the list of names.
      location ~* ^/(backup|site|www|html|public_html|wordpress|wp-content)\.(zip|tar\.gz|tgz|sql\.gz)$ { deny all; }
    fix-apache: |-
      # Add your own domain, e.g. example\.com, to the list of names.
      RedirectMatch 404 (?i)^/(backup|site|www|html|public_html|wordpress|wp-content)\.(zip|tar\.gz|tgz|sql\.gz)$
http:
  - method: GET
    path:
      - '{{BaseURL}}/backup.zip'
      - '{{BaseURL}}/backup.tar.gz'
      - '{{BaseURL}}/backup.tgz'
      - '{{BaseURL}}/backup.sql.gz'
      - '{{BaseURL}}/site.zip'
      - '{{BaseURL}}/www.zip'
      - '{{BaseURL}}/html.zip'
      - '{{BaseURL}}/public_html.zip'
      - '{{BaseURL}}/wordpress.zip'
      - '{{BaseURL}}/wp-content.zip'
      - '{{BaseURL}}/{{Host}}.zip'
      - '{{BaseURL}}/{{Host}}.tar.gz'
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: dsl
        dsl:
          - starts_with(hex_encode(body), "504b0304")
          - starts_with(hex_encode(body), "1f8b08")
          - starts_with(hex_encode(body), "377abcaf271c")
          - starts_with(hex_encode(body), "526172211a07")
        condition: or
      - type: regex
        part: body
        regex:
          - (?i)<title>[^<]*(?:404|not found)
        negative: true
