id: tuner-leak-dotenv
info:
  name: .env file exposed
  author: rhythm-tuner
  severity: critical
  description: Anyone can read database passwords, API keys and app secrets.
  remediation: |-
    Deny access to dotfiles, then rotate every secret in the file.
    nginx:  location ~ /\.(?!well-known) { deny all; }
    apache: <FilesMatch "^\."> Require all denied </FilesMatch>
  reference:
    - https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
  tags: tuner,leak,secrets,php,laravel,wordpress
  metadata:
    max-request: 4
    tuner-id: leak-dotenv
    tuner-profile: quick
    fix-nginx: location ~ /\.(?!well-known) { deny all; }
    fix-apache: |-
      <FilesMatch "^\.">
        Require all denied
      </FilesMatch>
http:
  - method: GET
    path:
      - '{{BaseURL}}/.env'
      - '{{BaseURL}}/.env.local'
      - '{{BaseURL}}/.env.production'
      - '{{BaseURL}}/.env.backup'
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - (?m)^[A-Za-z_][A-Za-z0-9_]*=
      - type: regex
        part: body
        regex:
          - (?i)<(?:!doctype|html|head|body)[\s>]
        negative: true
      - type: regex
        part: body
        regex:
          - (?i)<title>[^<]*(?:404|not found)
        negative: true
