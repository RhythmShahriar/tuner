id: tuner-php-phpmyadmin
info:
  name: phpMyAdmin login page public
  author: rhythm-tuner
  severity: medium
  description: The database admin login is open to the internet, so anyone can guess passwords against it. Old phpMyAdmin versions have known flaws.
  remediation: |-
    Limit phpMyAdmin to your IP address or a VPN, add HTTP authentication in
    front of it, or remove it and reach the database over an SSH tunnel.
  reference:
    - https://docs.phpmyadmin.net/en/latest/setup.html#securing-your-phpmyadmin-installation
  tags: tuner,php,database,admin
  metadata:
    max-request: 5
    tuner-id: php-phpmyadmin
    tuner-profile: default
    fix-nginx: |-
      # To keep access, add "allow <your IP>;" before deny all.
      location ~* ^/(phpmyadmin|pma|myadmin|dbadmin)/ { deny all; }
    fix-apache: |-
      # To keep access, use "Require ip <your IP>" instead.
      <LocationMatch "(?i)^/(phpmyadmin|pma|myadmin|dbadmin)/">
        Require all denied
      </LocationMatch>
http:
  - method: GET
    path:
      - '{{BaseURL}}/phpmyadmin/'
      - '{{BaseURL}}/phpMyAdmin/'
      - '{{BaseURL}}/pma/'
      - '{{BaseURL}}/myadmin/'
      - '{{BaseURL}}/dbadmin/'
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - <title>phpMyAdmin\b
          - name="pma_username"
        condition: or
      - type: regex
        part: body
        regex:
          - (?i)<title>[^<]*(?:404|not found)
        negative: true
