id: tuner-wp-user-enum-rest-route
info:
  name: User enumeration via ?rest_route=
  author: rhythm-tuner
  severity: medium
  description: Login names are public, which halves the work of a password-guessing attack. Blocking /wp-json/ alone does not stop this form of the request.
  remediation: |-
    Restrict the users endpoint to logged-in users in WordPress itself, which
    covers both /wp-json/ and ?rest_route=, e.g. with a security plugin, or:
    add_filter( 'rest_endpoints', function ( $e ) {
        if ( ! is_user_logged_in() ) { unset( $e['/wp/v2/users'], $e['/wp/v2/users/(?P<id>[\d]+)'] ); }
        return $e;
    } );
  reference:
    - https://developer.wordpress.org/rest-api/reference/users/
  tags: tuner,wordpress,enumeration
  metadata:
    max-request: 1
    tuner-id: wp-user-enum-rest-route
    tuner-profile: default
    tuner-requires: wordpress
http:
  - method: GET
    path:
      - '{{BaseURL}}/?rest_route=/wp/v2/users'
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        part: body
        regex:
          - '"slug"\s*:\s*"[^"]+"'
      - type: regex
        part: body
        regex:
          - (?i)<title>[^<]*(?:404|not found)
        negative: true
