# Tuner fix bundle for apache, from rhythm-tuner 0.4.0.
# 5 snippets for 9 findings. Review every block before you use it.
# Put it inside the site's <VirtualHost> block. Header lines need
# mod_headers and SSLProtocol needs mod_ssl. Then run: apachectl -t

# hdr-hsts-missing
#   https://shop.example.test/
#   https://blog.example.test/
# Start with a week, then raise max-age to 31536000. Add
# "; includeSubDomains" only when every subdomain serves HTTPS.
Header always set Strict-Transport-Security "max-age=604800"

# laravel-log, wp-debug-log
#   https://blog.example.test/wp-content/debug.log
#   https://blog.example.test/storage/logs/laravel.log
<FilesMatch "(\.log|^error_log)$">
  Require all denied
</FilesMatch>

# leak-dotenv, leak-ds-store
#   https://shop.example.test/.env
#   https://shop.example.test/.DS_Store
#   https://blog.example.test/.env.production
<FilesMatch "^\.">
  Require all denied
</FilesMatch>

# tls-legacy-protocol
#   https://shop.example.test/
SSLProtocol -all +TLSv1.2 +TLSv1.3

# wp-xmlrpc
#   https://shop.example.test/xmlrpc.php
<Files "xmlrpc.php">
  Require all denied
</Files>

# No apache snippet for: hdr-server-version, vuln-plugin-akismet, wp-user-enum-rest
# See: rhythm tuner explain <id>
