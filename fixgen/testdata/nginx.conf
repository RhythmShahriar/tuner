# Tuner fix bundle for nginx, from rhythm-tuner 0.4.0.
# 6 snippets for 10 findings. Review every block before you use it.
# Put it inside the site's server { } block, above any location ~ \.php$
# block. A location with its own add_header lines drops these headers, so
# repeat them there. Then run: nginx -t

# hdr-hsts-missing
#   https://shop.example.test/
#   https://blog.example.test/
# Start with a week, then raise max-age to 31536000. Add
# "; includeSubDomains" only when every subdomain serves HTTPS.
add_header Strict-Transport-Security "max-age=604800" always;

# hdr-server-version
#   https://shop.example.test/
server_tokens off;

# laravel-log, wp-debug-log
#   https://blog.example.test/wp-content/debug.log
#   https://blog.example.test/storage/logs/laravel.log
location ~* (\.log|/error_log)$ { deny all; }

# leak-dotenv, leak-ds-store
#   https://shop.example.test/.env
#   https://shop.example.test/.DS_Store
#   https://blog.example.test/.env.production
location ~ /\.(?!well-known) { deny all; }

# tls-legacy-protocol
#   https://shop.example.test/
ssl_protocols TLSv1.2 TLSv1.3;

# wp-xmlrpc
#   https://shop.example.test/xmlrpc.php
location = /xmlrpc.php { deny all; }

# No nginx snippet for: vuln-plugin-akismet, wp-user-enum-rest
# See: rhythm tuner explain <id>
