id: local-log-file
name: Log file in the web root
severity: medium
confidence: high
tags: [leak, disclosure]
scope: web
files: ["**/debug.log", "**/error_log", "**/error.log", "**/php_errors.log", "**/php-errors.log"]
extract:
  secrets: true
impact: Error logs reveal file paths, plugin internals, and sometimes queries, emails or tokens.
fix: Write logs outside the web root (WP_DEBUG_LOG or error_log in php.ini) and delete this one.
