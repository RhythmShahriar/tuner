# The Apache server config validate-config.sh runs a bundle under. It is
# the testbed's own httpd.conf (mounted as conf/testbed.conf) plus the
# modules hardening bundles commonly use and AllowOverride All, so the
# docroot's .htaccess is read on each request as on a typical host.
Include conf/testbed.conf
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule access_compat_module modules/mod_access_compat.so
ErrorLog /proc/self/fd/2
<Directory "/var/www/html">
    AllowOverride All
</Directory>
# httpd -t -D SYNTAX parses the bundle as part of the server config,
# inside the docroot's <Directory>. apachectl -t alone never reads a
# .htaccess, so without this the syntax check would pass any bundle.
<IfDefine SYNTAX>
    <Directory "/var/www/html">
        Include conf/harden.conf
    </Directory>
</IfDefine>
