# Tuner's WordPress testbed: one deliberately broken WordPress install
# served two ways (nginx and Apache), a subfolder install and a WAF
# challenge front. testbed/ground-truth.yaml says what is really here;
# testbed/bench scores the scanners against it.
#
#   make testbed       build the plugin tree and start everything
#   make benchmark     run the scanners and write docs/benchmark.md
#   make testbed-down  stop and remove it all
#
# Everything is thrown away on down: the database is in tmpfs and
# WordPress in volumes removed with -v. Nothing here is a real secret and
# no plugin holds a working exploit. Images are pinned by tag and digest,
# so a re-pushed tag can't change the benchmark; Dependabot's
# docker-compose updates move both together.
name: tuner-testbed

x-db-env: &db-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress

services:
  db:
    image: mariadb:11.4.8@sha256:bc474f00629f0123c10f9e1bca193a45d18af15a274cf0656acda64f1086c3b6
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The WordPress application container. php-fpm so both nginx and Apache
  # front it. The old core (WORDPRESS_VERSION) and the broken files come
  # from the bind mounts and the init script.
  wp:
    image: wordpress:6.4.1-php8.1-fpm@sha256:0a8482375e4b9e604ab8b7b4a426b9455dac4c62e78f4f857278976cad7e95be
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-env
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('DISABLE_WP_CRON', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
    volumes:
      - wp:/var/www/html
      - ./wp/content/plugins:/var/www/html/wp-content/mu-plugins-src:ro
      - ./wp/init.sh:/docker-entrypoint-init.d/init.sh:ro

  nginx:
    image: nginx:1.27.3-alpine@sha256:814a8e88df978ade80e584cc5b333144b9372a8e3c98872d07137dbf3b44d0e4
    depends_on: [wp]
    ports:
      - "127.0.0.1:${TESTBED_MAIN_PORT:-20280}:80"
      - "127.0.0.1:${TESTBED_BLOG_PORT:-20282}:81"
    volumes:
      - wp:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  apache:
    image: httpd:2.4.62@sha256:4c7788695c832bf415a662dfb5160f1895e65fc65c025e85f436ee2c9e7d7f3e
    depends_on: [wp]
    ports:
      - "127.0.0.1:${TESTBED_APACHE_PORT:-20281}:80"
    volumes:
      - wp:/var/www/html:ro
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro

  # A Cloudflare-style challenge in front of a second copy: every path
  # answers 403 with a challenge page. The expected benchmark result is
  # "blocked", not a score.
  waf:
    image: nginx:1.27.3-alpine@sha256:814a8e88df978ade80e584cc5b333144b9372a8e3c98872d07137dbf3b44d0e4
    ports:
      - "127.0.0.1:${TESTBED_WAF_PORT:-20283}:80"
    volumes:
      - ./nginx/waf.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  wp:
