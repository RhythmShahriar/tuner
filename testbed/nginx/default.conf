# The main site on :80 and the subfolder install on :81 (mapped to the
# testbed's blog port). Deliberately serves dotfiles and backups, which a
# hardened config would deny; the C6 server-config bundles are what close
# these, validated by make testbed-config.
server {
    listen 80 default_server;
    root /var/www/html;
    index index.php;
    location / { try_files $uri $uri/ /index.php?$args; }
    location ~ \.php$ {
        fastcgi_pass wp:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
server {
    listen 81;
    root /var/www/html;
    # The subfolder install: /blog/ maps to the same tree under a prefix.
    location /blog/ {
        alias /var/www/html/;
        index index.php;
        location ~ \.php$ {
            fastcgi_pass wp:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
    }
}
