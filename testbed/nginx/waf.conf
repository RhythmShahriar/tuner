# A Cloudflare-style challenge on every path, to prove a scan reports
# "blocked" instead of scoring a challenge page.
server {
    listen 80 default_server;
    add_header cf-mitigated challenge always;
    add_header Server cloudflare always;
    location / {
        return 403 '<!DOCTYPE html><html><head><title>Just a moment...</title></head><body>__cf_chl_opt</body></html>';
    }
}
