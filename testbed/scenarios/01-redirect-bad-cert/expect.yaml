# QA gap 1. http:// redirects to the same host on https:// whose
# certificate nobody trusts. The scan must say so and stop, not report a
# clean site.
title: an http to https redirect onto a bad certificate is an error
qa: [1]
servers:
  - name: site
    routes:
      "*": {status: 301, headers: {Location: "https://127.0.0.1:{{port:tls}}/"}}
  - name: tls
    tls: self-signed
    routes:
      /: {body: "<html><title>Secure</title></html>"}
steps:
  - args: [scan, "{{url:site}}", --no-vulns, --no-check-updates, --rate, "0", --plain, -o, report.json]
    expect:
      exit: 3
      stderr:
        matches: ["(?i)certificate"]
      stdout:
        not_contains: ["Score 100/100"]
