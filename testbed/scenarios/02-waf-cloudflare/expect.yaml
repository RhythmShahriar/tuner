# QA gap 2, bug 13. Every path answers with a Cloudflare block page. Tuner never
# saw the site, so the report must say it was blocked and is partial.
title: a Cloudflare block page on every path marks the scan blocked
qa: [2]
xfail: E7
servers:
  - name: site
    routes:
      "*": {status: 403, body: "<!DOCTYPE html><html><head><title>Just a moment...</title></head><body><script src=\"/cdn-cgi/challenge-platform/h/b/orchestrate/chl_page/v1?ray=1\"></script>__cf_chl_opt</body></html>", headers: {Server: cloudflare, cf-mitigated: challenge, CF-RAY: 8f00000000000000-SYD}}
steps:
  - args: [scan, "{{url:site}}", --no-vulns, --no-check-updates, --rate, "0", --plain, -o, report.json]
    expect:
      output:
        contains: ["results are partial"]
        not_contains: ["server returns real 404s"]
      files:
        report.json:
          json: {complete: false, blocked_by: cloudflare, stopped_by: waf}
  - name: the gate
    args: [scan, "{{url:site}}", --no-vulns, --no-check-updates, --rate, "0", --plain, --fail-on, high]
    expect:
      exit: 3
