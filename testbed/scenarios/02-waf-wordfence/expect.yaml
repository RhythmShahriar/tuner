# QA gap 2, bug 13. Every path answers with a Wordfence block page. Tuner never
# saw the site, so the report must say it was blocked and is partial.
title: a Wordfence block page on every path marks the scan blocked
qa: [2]
xfail: E7
servers:
  - name: site
    routes:
      "*": {status: 403, body: "<html><head><title>Your access to this site has been limited</title></head><body><h1>Your access to this site has been limited by the site owner</h1><p>Generated by Wordfence</p></body></html>", headers: {Set-Cookie: "wfvt_123456=abc; path=/"}}
steps:
  - args: [scan, "{{url:site}}", --no-vulns, --no-check-updates, --rate, "0", --plain, -o, report.json]
    expect:
      output:
        contains: ["results are partial"]
        not_contains: ["server returns real 404s"]
      files:
        report.json:
          json: {complete: false, blocked_by: wordfence, stopped_by: waf}
  - name: the gate
    args: [scan, "{{url:site}}", --no-vulns, --no-check-updates, --rate, "0", --plain, --fail-on, high]
    expect:
      exit: 3
