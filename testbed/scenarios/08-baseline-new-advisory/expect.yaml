# QA gap 8, bug 3. A low advisory on a plugin is accepted into a
# baseline. Later a critical, actively exploited advisory appears on the
# same plugin. The baseline must not hide it.
title: a baseline never hides a new advisory on a baselined component
qa: [8]
tree:
  - copy: ../_fixtures/wordpress
    to: site
steps:
  - name: accept today's findings
    args: [scan, ./site, --plain, -q, -o, baseline.json]
    expect:
      exit: 0
      files:
        baseline.json:
          finding_ids: [vuln-plugin-gallery]
          not_contains: [CVE-2026-0002]
  - name: a new critical advisory
    data_state: v2
    tree:
      - remove: "{{cache}}/tuner/vulns"
    args: [scan, ./site, --plain, --baseline, baseline.json, --fail-on, high, -o, report.json]
    expect:
      exit: 1
      stdout:
        contains: [CVE-2026-0002]
      files:
        report.json:
          finding_ids: [vuln-plugin-gallery]
          contains: [CVE-2026-0002]
