# QA gap 9, bug 14. A vulnerability data service that never answers. The scan must not wait
# long, must say known vulnerabilities weren't checked and must not pass
# a --fail-on gate as if they had been.
title: a vulnerability data service that never answers fails the gate quickly
qa: [9]
data:
  state: hang
tree:
  - copy: ../_fixtures/wordpress
    to: site
steps:
  - args: [scan, ./site, --plain, --fail-on, high, -o, report.json]
    timeout: 60s
    expect:
      exit: 3
      max_time: 15s
      output:
        matches: ["(?i)vulnerabilit(y|ies)"]
        not_contains: [panic]
      files:
        report.json:
          json: {vuln_data: missing}
