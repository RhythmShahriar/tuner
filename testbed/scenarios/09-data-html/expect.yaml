# QA gap 9, bug 14. a vulnerability data service answering HTML instead of JSON. The scan must not wait
# long, must say known vulnerabilities weren't checked and must not pass
# a --fail-on gate as if they had been.
title: a vulnerability data service answering HTML instead of JSON fails the gate quickly
qa: [9]
xfail: U4
xfail_covers: ['exit 0, want 3', 'report.json: no vuln_data']
data:
  state: html
tree:
  - copy: ../_fixtures/wordpress
    to: site
steps:
  - args: [scan, ./site, --plain, --fail-on, high, -o, report.json]
    timeout: 60s
    expect:
      exit: 3
      max_time: 15s
      output:
        matches: ["(?i)vulnerabilit(y|ies)"]
        not_contains: [panic]
      files:
        report.json:
          json: {vuln_data: missing}
