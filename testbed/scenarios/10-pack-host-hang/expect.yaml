# QA gap 10, bug 16. The check pack host never answers. A scan must not
# wait for it every time. It must say it used other checks, also under
# -q. A build without a trusted signing key (this one) never
# fetches a pack, so TUNER_CHECKS_INSECURE=1 makes it try. With nothing
# cached the first run waits for the archive (up to 10 s), then the
# client backs off and the next run does not ask at all.
title: a hanging check pack host doesn't hold up every scan
qa: [10]
servers:
  - name: site
    routes:
      /: {body: "<html><body>home</body></html>"}
  - name: packhost
    routes:
      "*": {hang: true}
steps:
  - name: first run
    args: [scan, "{{url:site}}", --no-vulns, --rate, "0", --plain, -q, --profile, quick]
    env: {TUNER_CHECKS_URL: "{{url:packhost}}/checks-latest", TUNER_CHECKS_INSECURE: "1"}
    timeout: 30s
    expect:
      max_time: 12s
      stderr:
        contains: ["check pack host unreachable, using built-in checks"]
  - name: second run backs off
    args: [scan, "{{url:site}}", --no-vulns, --rate, "0", --plain, -q, --profile, quick]
    env: {TUNER_CHECKS_URL: "{{url:packhost}}/checks-latest", TUNER_CHECKS_INSECURE: "1"}
    expect:
      max_time: 2s
      requests:
        packhost: {max: 0}
