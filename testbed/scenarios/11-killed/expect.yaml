# QA gap 11, bug 9. A run killed mid-scan must leave the previous report
# as it was, not an empty file.
title: a killed scan keeps the previous report intact
qa: [11]
skip_on: [windows]
servers:
  - name: site
    routes:
      "*": {hang: true}
tree:
  - write: report.json
    content: '{"target":"previous run","score":97,"findings":[]}'
steps:
  - args: [scan, "{{url:site}}", --no-vulns, --no-check-updates, --rate, "0", --plain, -q, -o, report.json]
    signals:
      - {after: 1s, signal: KILL}
    expect:
      exit: -1
      files:
        report.json:
          json: {target: previous run}
  - name: every target failed
    args: [scan, "http://127.0.0.1:1", --no-vulns, --no-check-updates, --plain, -q, -o, report.json]
    expect:
      exit: 3
      files:
        report.json:
          json: {target: previous run}
