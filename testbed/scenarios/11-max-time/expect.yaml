# QA gap 11, bugs 10 and 12. --max-time ends a slow scan on time, says
# why and marks the report.
title: --max-time stops on time and marks the report
qa: [11, 15]
xfail: U4 R3
xfail_covers: ['report.json: no (complete|stopped_by)$']
servers:
  - name: site
    routes:
      "*": {delay: 400ms, status: 404, body: "<h1>Not Found</h1>"}
      /: {body: "<html><body>home</body></html>"}
steps:
  - args: [scan, "{{url:site}}", --no-vulns, --no-check-updates, --rate, "0", -c, "1", --plain, --max-time, 2s, -o, report.json]
    expect:
      exit: 3
      max_time: 6s
      stderr:
        contains: ["stopped by --max-time"]
      files:
        report.json:
          json: {complete: false, stopped_by: max-time}
